# Run the Windlass panel itself as a container.
#
#   docker compose -f docker-compose.install.yaml up -d
#
# Notes:
# - Only the socket proxy mounts docker.sock. It allowlists the API families
#   needed by Compose; container creation remains a privileged trust boundary.
# - Self-update is disabled in container mode; update by pulling a newer
#   image instead.
# - Projects live in the named volume; mount a host path instead if you
#   want to hand-edit compose files from the host.
services:
  docker-proxy:
    # See the proxy unit in install.sh for why this proxy and these paths.
    image: ghcr.io/wollomatic/socket-proxy:1.14.0
    restart: unless-stopped
    user: "0:0"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - -listenip=0.0.0.0
      - -allowfrom=windlass
      - -allowHEAD=/(v[0-9.]+/)?(_ping|version|info|events|system|build|grpc|session|containers|exec|images|networks|volumes)(/.*)?
      - -allowGET=/(v[0-9.]+/)?(_ping|version|info|events|system|build|grpc|session|containers|exec|images|networks|volumes)(/.*)?
      - -allowPOST=/(v[0-9.]+/)?(_ping|version|info|events|system|build|grpc|session|containers|exec|images|networks|volumes)(/.*)?
      - -allowPUT=/(v[0-9.]+/)?(_ping|version|info|events|system|build|grpc|session|containers|exec|images|networks|volumes)(/.*)?
      - -allowDELETE=/(v[0-9.]+/)?(_ping|version|info|events|system|build|grpc|session|containers|exec|images|networks|volumes)(/.*)?
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [control]

  windlass:
    image: ghcr.io/sulaiman-dauda/windlass:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - windlass_data:/var/lib/windlass
    environment:
      DOCKER_HOST: tcp://docker-proxy:2375
    depends_on: [docker-proxy]
    networks: [control, outbound]
volumes:
  windlass_data:
networks:
  control:
    internal: true
  outbound: {}
